<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Website Factory</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; padding: 20px; }
        textarea { width: 100%; height: 100px; }
        iframe { width: 100%; height: 500px; border: 1px solid #ccc; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>AI Website Generator</h1>
    <input type="password" id="apiKey" placeholder="Enter your Gemini/OpenAI API Key">
    <textarea id="prompt" placeholder="Describe the website you want..."></textarea>
    <button onclick="generateSite()">Generate Website</button>
    <iframe id="preview"></iframe>

    <script>
        async function generateSite() {
            const prompt = document.getElementById('prompt').value;
            const key = document.getElementById('apiKey').value;
            
            // This is a simplified fetch to an AI provider
            // In a real app, you'd call the Gemini or OpenAI API here
            const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + key, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: "Write only valid HTML/CSS for: " + prompt }] }] })
            });

            const data = await response.json();
            const code = data.candidates[0].content.parts[0].text;
            
            const preview = document.getElementById('preview');
            preview.srcdoc = code;
        }
    </script>
</body>
</html>
